name: Bot Poltronix

on:
  schedule:
    # Pedidos enviados no privado do bot: confere a cada 10 minutos
    - cron: "*/10 * * * *"
    # Postagens automáticas dos lançamentos (horário UTC; 15h, 21h e 01h UTC = 12h, 18h e 22h de Brasília)
    - cron: "0 15,21,1 * * *"
  workflow_dispatch:
    inputs:
      filme:
        description: "Nome do filme para postar agora (opcional)"
        required: false

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Postar filme pedido manualmente no GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.filme != ''
        run: python bot.py "${{ inputs.filme }}"

      - name: Postagem automática de lançamentos
        if: github.event.schedule == '0 15,21,1 * * *'
        run: python bot.py --populares 1

      - name: Pedidos enviados no privado do bot
        run: python bot.py --comandos

      - name: Salvar histórico
        run: |
          git config user.name "bot-poltronix"
          git config user.email "bot-poltronix@users.noreply.github.com"
          git add postados.json offset.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Atualiza histórico de posts" && git push)
