name: Bot Poltronix

on:
  schedule:
    # Pedidos e aprovações no Telegram: confere a cada 5 minutos
    - cron: "*/5 * * * *"
    # Sugestões automáticas de lançamentos (chegam no rascunho para aprovar) (horário UTC; 15h, 21h e 01h UTC = 12h, 18h e 22h de Brasília)
    - cron: "0 15,21,1 * * *"
  workflow_dispatch:
    inputs:
      filme:
        description: "Nome do filme para mandar prévia agora (opcional)"
        required: false

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Prévia de filme pedido pelo GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.filme != ''
        run: python bot.py "${{ inputs.filme }}"

      - name: Sugestão automática de lançamentos (vai para o rascunho)
        if: github.event.schedule == '0 15,21,1 * * *'
        run: python bot.py --populares 1

      - name: Pedidos de filmes e aprovações
        run: python bot.py --comandos

      - name: Salvar histórico
        if: always()
        run: |
          ls -la
          git config user.name "bot-poltronix"
          git config user.email "bot-poltronix@users.noreply.github.com"
          git add -A -- $(ls postados.json offset.txt rascunho.txt 2>/dev/null)
          git status --short
          if git diff --cached --quiet; then echo "Nada novo para salvar"; exit 0; fi
          git commit -m "Atualiza histórico de posts"
          git pull --rebase -X theirs origin main
          git push
